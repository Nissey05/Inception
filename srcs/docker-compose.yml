services:
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    ports:
      - "3306:3306"
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - wordpress
    restart: unless-stopped
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    ports:
      - "9000:9000"
    networks:
      - inception
    depends_on:
      - mariadb
    restart: unless-stopped
    volumes:
      - wordpress_data:/var/www/html
    
volumes:
  mariadb_data:
    name: mariadb
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /home/nils/projects/inception/mariadb_data/
  wordpress_data:
    name: wordpress
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /home/nils/projects/inception/wordpress_data/


networks:
  inception:
    driver: bridge